<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OEP — Calendario Laboral</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <nav class="navbar navbar-dark" style="background:#1a3d7c;">
    <div class="container-fluid">
      <span class="navbar-brand">OEP — Calendario Laboral</span>
      <div class="d-flex align-items-center gap-3">
        <span class="text-white" id="nav-usuario"></span>
        <a href="estadisticas.html" class="btn btn-outline-light btn-sm">Estadísticas</a>
        <a href="historial.html" class="btn btn-outline-light btn-sm">Mis acciones</a>
        <a href="perfil.html" class="btn btn-outline-light btn-sm">Mi perfil</a>
        <a href="jerarquia.html" id="nav-jerarquia" class="btn btn-outline-light btn-sm" style="display:none;">Jerarquía</a>
        <a href="calendario.html" id="nav-calendario" class="btn btn-outline-light btn-sm" style="display:none;">Calendario</a>
        <button class="btn btn-outline-light btn-sm" onclick="cerrarSesion()">Cerrar sesión</button>
      </div>
    </div>
  </nav>

  <div class="container my-4" style="max-width:1000px;">

    <div class="card mb-3">
      <div class="card-body">
        <h5 class="mb-3">Registrar día no laborable / excepción</h5>
        <div class="row g-2">
          <div class="col-md-3">
            <label class="form-label">Fecha</label>
            <input type="date" id="c-fecha" class="form-control">
          </div>
          <div class="col-md-2">
            <label class="form-label">¿Laborable?</label>
            <select id="c-laborable" class="form-select">
              <option value="NO">NO</option>
              <option value="SI">SI</option>
            </select>
          </div>
          <div class="col-md-3">
            <label class="form-label">Motivo</label>
            <input type="text" id="c-motivo" class="form-control" placeholder="Ej: Feriado nacional">
          </div>
          <div class="col-md-4">
            <label class="form-label">Observación</label>
            <input type="text" id="c-obs" class="form-control" placeholder="Opcional">
          </div>
        </div>
        <div class="mt-3 d-flex gap-2">
          <button class="btn btn-primary" onclick="guardarDia()">💾 Guardar</button>
          <button class="btn btn-outline-secondary" onclick="limpiarForm()">Limpiar</button>
        </div>
        <div id="msg" class="mt-2"></div>
      </div>
    </div>

    <div class="card">
      <div class="card-body">
        <div class="d-flex justify-content-between mb-2">
          <h6 class="mb-0">Días registrados</h6>
          <button class="btn btn-sm btn-outline-secondary" onclick="cargarCalendario()">🔄 Recargar</button>
        </div>
        <div class="table-responsive">
          <table class="table table-sm table-striped" id="tabla-cal">
            <thead class="table-dark">
              <tr>
                <th>Fecha</th>
                <th>Laborable</th>
                <th>Motivo</th>
                <th>Observación</th>
                <th></th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </div>

  </div>

  <script src="calendario.js"></script>
  <script>
    (function(){
      try {
        var U = JSON.parse(localStorage.getItem('oep_usuario') || 'null');
        if (!U) return;
        var rol = (U.rol || U.cargo || '').toString();
        var verJerarquia = ['Presidencia','Despacho','Observatorio','CNC','Gerente de Región','Gerente de Estado','Jefe de OPT'];
        var verCalendario = ['Observatorio','CNC'];
        if (verJerarquia.indexOf(rol) !== -1) {
          document.getElementById('nav-jerarquia').style.display = '';
        }
        if (verCalendario.indexOf(rol) !== -1) {
          document.getElementById('nav-calendario').style.display = '';
        }
      } catch(e) {}
    })();
  </script>
</body>
</html>
