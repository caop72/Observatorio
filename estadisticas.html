<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OEP — Estadísticas</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=100">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>

  <nav class="navbar navbar-dark" style="background:#1a3d7c;">
    <div class="container-fluid">
      <span class="navbar-brand">OEP — Estadísticas</span>
      <div class="d-flex align-items-center gap-3">
        <span class="text-white" id="nav-usuario"></span>
        <a href="filtros.html" id="nav-filtros" class="btn btn-outline-light btn-sm" style="display:none;">Filtros</a>
        <a href="jerarquia.html" id="nav-jerarquia" class="btn btn-outline-light btn-sm" style="display:none;">Jerarquía</a>
        <a href="historial.html" class="btn btn-outline-light btn-sm">Mis acciones</a>
        <a href="perfil.html" class="btn btn-outline-light btn-sm">Mi perfil</a>
        <button class="btn btn-outline-light btn-sm" onclick="cerrarSesion()">Cerrar sesión</button>
      </div>
    </div>
  </nav>

  <div class="container my-4" style="max-width:1200px;">

    <div class="card mb-3 shadow-sm">
      <div class="card-body text-center">
        <h6 class="text-muted mb-1">Total OPTs</h6>
        <h2 class="mb-0" id="kpi-total">0</h2>
      </div>
    </div>

    <div class="row mb-3">
      <div class="col-md-4">
        <div class="card shadow-sm">
          <div class="card-body">
            <h6>Reporte</h6>
            <canvas id="chart-reporte" height="200"></canvas>
          </div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card shadow-sm">
          <div class="card-body">
            <h6>Estatus</h6>
            <canvas id="chart-estatus" height="200"></canvas>
          </div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card shadow-sm">
          <div class="card-body">
            <h6>Legalidad</h6>
            <canvas id="chart-legalidad" height="200"></canvas>
          </div>
        </div>
      </div>
    </div>

    <div class="row mb-3">
      <div class="col-12">
        <div class="card shadow-sm">
          <div class="card-body">
            <h6>OPTs por Región</h6>
            <canvas id="chart-region" height="80"></canvas>
          </div>
        </div>
      </div>
    </div>

    <div class="row mb-3">
      <div class="col-12">
        <div class="card shadow-sm">
          <div class="card-body">
            <h6>Reportes por día (últimos 30 días)</h6>
            <canvas id="chart-dias" height="80"></canvas>
          </div>
        </div>
      </div>
    </div>

  </div>

  <script src="estadisticas.js?v=10"></script>
  <script>
    (function(){
      try {
        var U = JSON.parse(localStorage.getItem('oep_usuario') || 'null');
        if (!U) return;
        var rol = (U.rol || U.cargo || '').toString();
        var verJ = ['Presidencia','Despacho','Observatorio','CNC','Gerente de Región','Gerente de Estado','Jefe de OPT'];
        var verF = ['Presidencia','Despacho','Observatorio','CNC','Gerente de Región','Gerente de Estado'];
        if (verJ.indexOf(rol) !== -1) document.getElementById('nav-jerarquia').style.display = '';
        if (verF.indexOf(rol) !== -1) document.getElementById('nav-filtros').style.display = '';
      } catch(e) {}
    })();
  </script>
</body>
</html>
