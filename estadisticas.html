<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OEP — Estadísticas</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=100">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>

  <nav class="navbar navbar-dark" style="background:#1a3d7c;">
    <div class="container-fluid">
      <span class="navbar-brand">OEP — Estadísticas</span>
      <div class="d-flex align-items-center gap-3">
        <span class="text-white" id="nav-usuario"></span>
        <a href="filtros.html" id="nav-filtros" class="btn btn-outline-light btn-sm" style="display:none;">Filtros</a>
        <a href="jerarquia.html" id="nav-jerarquia" class="btn btn-outline-light btn-sm" style="display:none;">Jerarquía</a>
        <a href="historial.html" class="btn btn-outline-light btn-sm">Mis acciones</a>
        <a href="perfil.html" class="btn btn-outline-light btn-sm">Mi perfil</a>
        <button class="btn btn-outline-light btn-sm" onclick="cerrarSesion()">Cerrar sesión</button>
      </div>
    </div>
  </nav>

  <div class="container my-4" style="max-width:1200px;">

    <div class="card mb-4 shadow-sm border-primary">
      <div class="card-body text-center bg-light">
        <h6 class="text-muted mb-1">Total OPTs Registradas</h6>
        <h2 class="mb-0 text-primary" id="kpi-total">0</h2>
      </div>
    </div>

    <!-- DASHBOARD CON SELECTOR -->
    <div class="card shadow-sm mb-4">
      <div class="card-body bg-light border-bottom">
        <label for="selector-grafico" class="fw-bold mb-2">Seleccione el análisis que desea visualizar:</label>
        <!-- Opciones ordenadas alfabéticamente -->
        <select id="selector-grafico" class="form-select form-select-lg fw-bold" onchange="cambiarGrafico(this.value)">
          <option value="activas">1. Activas vs Inactivas</option>
          <option value="cobertura">2. Cobertura Parroquial</option>
          <option value="estatus">3. Estatus Legal</option>
          <option value="operativas">4. Estatus de Operatividad (Técnico)</option>
          <option value="region">5. OPTs por Región</option>
          <option value="poblacion_afectada">6. Población Afectada por Inoperatividad</option>
          <option value="poblacion_total">7. Población Total Atendida</option>
          <option value="reporte">8. Reportes por Semáforo</option>
          <option value="top10">9. Top 10 Estados</option>
        </select>
      </div>
    </div>

    <!-- CONTENEDOR DINÁMICO -->
    <div class="row mb-4" id="contenedor-grafico-dinamico">
      <div class="col-md-12">
        <div class="card shadow-sm h-100">
          <div class="card-body">
            <h5 class="fw-bold text-primary" id="din-titulo">Cargando gráfico...</h5>
            <p class="text-muted small" id="din-subtitulo">...</p>
            
            <div id="din-canvas-container">
                <canvas id="chart-dinamico" height="150"></canvas>
            </div>

            <hr class="my-4">
            
            <!-- LOS 3 RECUADROS DEL ANÁLISIS -->
            <div class="row">
              <div class="col-md-4">
                <div class="card bg-light border-success h-100">
                  <div class="card-body">
                    <h6 class="fw-bold text-success small">📋 RESUMEN EJECUTIVO</h6>
                    <p class="small mb-0" id="din-resumen">Cargando...</p>
                  </div>
                </div>
              </div>
              <div class="col-md-4">
                <div class="card bg-light border-danger h-100">
                  <div class="card-body">
                    <h6 class="fw-bold text-danger small">⚠️ ACCIONES SUGERIDAS</h6>
                    <p class="small mb-0" id="din-acciones">Cargando...</p>
                  </div>
                </div>
              </div>
              <div class="col-md-4">
                <div class="card bg-light border-warning h-100">
                  <div class="card-body">
                    <h6 class="fw-bold text-warning small">💡 OBSERVACIONES</h6>
                    <p class="small mb-0" id="din-observaciones">Cargando...</p>
                  </div>
                </div>
              </div>
            </div>

          </div>
        </div>
      </div>
    </div>
    
  </div>

  <script src="estadisticas.js?v=16"></script>
  <script>
    (function(){
      try {
        var U = JSON.parse(localStorage.getItem('oep_usuario') || 'null');
        if (!U) return;
        var rol = (U.rol || U.cargo || '').toString();
        var verJ = ['Presidencia','Despacho','Observatorio','CNC','Gerente de Región','Gerente de Estado','Jefe de OPT'];
        var verF = ['Presidencia','Despacho','Observatorio','CNC','Gerente de Región','Gerente de Estado'];
        if (verJ.indexOf(rol) !== -1) document.getElementById('nav-jerarquia').style.display = '';
        if (verF.indexOf(rol) !== -1) document.getElementById('nav-filtros').style.display = '';
      } catch(e) {}
    })();
  </script>
</body>
</html>
