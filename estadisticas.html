<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OEP — Estadísticas</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>

  <nav class="navbar navbar-dark" style="background:#1a3d7c;">
    <div class="container-fluid">
      <span class="navbar-brand">OEP — Estadísticas</span>
      <div class="d-flex align-items-center gap-3">
        <span class="text-white" id="nav-usuario"></span>
        <a href="estadisticas.html" class="btn btn-outline-light btn-sm">Estadísticas</a>
        <a href="historial.html" class="btn btn-outline-light btn-sm">Mis acciones</a>
        <a href="perfil.html" class="btn btn-outline-light btn-sm">Mi perfil</a>
        <button class="btn btn-outline-light btn-sm" onclick="cerrarSesion()">Cerrar sesión</button>
      </div>
    </div>
  </nav>

  <div class="container my-4" style="max-width:1200px;">

    <!-- FILTROS -->
    <div class="card mb-3">
      <div class="card-body">
        <h5 class="mb-3">Filtros</h5>
        <div class="row g-2">
          <div class="col-md-2">
            <label class="form-label">Desde</label>
            <input type="date" id="f-desde" class="form-control">
          </div>
          <div class="col-md-2">
            <label class="form-label">Hasta</label>
            <input type="date" id="f-hasta" class="form-control">
          </div>
          <div class="col-md-2">
            <label class="form-label">Semáforo</label>
            <select id="f-semaforo" class="form-select">
              <option value="">Todos</option>
              <option value="AMARILLO">Amarillo</option>
              <option value="AZUL">Azul</option>
              <option value="ROJO">Rojo</option>
              <option value="CIERRE">Cierre</option>
              <option value="GRIS">Gris</option>
            </select>
          </div>
          <div class="col-md-3">
            <label class="form-label">Estado (opcional)</label>
            <input type="text" id="f-estado" class="form-control" placeholder="Ej: Carabobo">
          </div>
          <div class="col-md-3">
            <label class="form-label">&nbsp;</label>
            <div class="d-flex gap-2">
              <button class="btn btn-primary flex-grow-1" onclick="cargarEstadisticas()">🔍 Aplicar</button>
              <button class="btn btn-outline-secondary" onclick="limpiarFiltros()">Limpiar</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- KPIs -->
    <div class="row mb-3">
      <div class="col-md-3">
        <div class="card text-center">
          <div class="card-body">
            <h6 class="text-muted mb-1">Total reportes</h6>
            <h3 id="kpi-total" class="mb-0">0</h3>
          </div>
        </div>
      </div>
      <div class="col-md-3">
        <div class="card text-center">
          <div class="card-body">
            <h6 class="text-muted mb-1">Semáforo dominante</h6>
            <h3 id="kpi-semaforo" class="mb-0">-</h3>
          </div>
        </div>
      </div>
      <div class="col-md-3">
        <div class="card text-center">
          <div class="card-body">
            <h6 class="text-muted mb-1">Días con reportes</h6>
            <h3 id="kpi-dias" class="mb-0">0</h3>
          </div>
        </div>
      </div>
      <div class="col-md-3">
        <div class="card text-center">
          <div class="card-body">
            <h6 class="text-muted mb-1">Agrupaciones</h6>
            <h3 id="kpi-agrupaciones" class="mb-0">0</h3>
          </div>
        </div>
      </div>
    </div>

    <!-- GRÁFICOS -->
    <div class="row mb-3">
      <div class="col-md-4">
        <div class="card">
          <div class="card-body">
            <h6>Distribución por semáforo</h6>
            <canvas id="chart-torta" height="200"></canvas>
          </div>
        </div>
      </div>
      <div class="col-md-8">
        <div class="card">
          <div class="card-body">
            <h6 id="titulo-barras">Reportes por OPT</h6>
            <canvas id="chart-barras" height="200"></canvas>
          </div>
        </div>
      </div>
    </div>

    <div class="row mb-3">
      <div class="col-12">
        <div class="card">
          <div class="card-body">
            <h6>Reportes por día</h6>
            <canvas id="chart-linea" height="100"></canvas>
          </div>
        </div>
      </div>
    </div>

    <!-- TABLA -->
    <div class="card">
      <div class="card-body">
        <div class="d-flex justify-content-between mb-2">
          <h6 class="mb-0">Detalle de reportes</h6>
          <button class="btn btn-sm btn-outline-success" onclick="exportarCSV()">📥 Exportar CSV</button>
        </div>
        <div class="table-responsive">
          <table class="table table-sm table-striped" id="tabla-reportes">
            <thead class="table-dark">
              <tr>
                <th>Fecha</th>
                <th>Reporte</th>
                <th>OPT</th>
                <th>Estado</th>
                <th>Semáforo</th>
                <th>Estado reporte</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </div>

  </div>

  <script src="estadisticas.js"></script>
</body>
</html>
