<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OEP — Observatorio Estratégico Postal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- SPLASH -->
  <div id="vista-splash" class="vista activa">
    <div class="splash-contenido">
      <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/0/0e/IPOSTEL_logo.png/240px-IPOSTEL_logo.png"
           alt="IPOSTEL" class="logo-splash"
           onerror="this.style.display='none'">
      <h1>IPOSTEL</h1>
      <p class="subtitulo">Observatorio Estratégico Postal</p>
      <button class="btn btn-primary btn-lg mt-4" onclick="irA('login')">Acceder</button>
    </div>
  </div>

  <!-- LOGIN -->
  <div id="vista-login" class="vista">
    <div class="card-form">
      <h2>Iniciar Sesión</h2>
      <div class="mb-3">
        <label class="form-label">Usuario</label>
        <input type="text" id="login-usuario" class="form-control" autocomplete="username">
      </div>
      <div class="mb-3">
        <label class="form-label">Clave</label>
        <input type="password" id="login-clave" class="form-control" autocomplete="current-password">
      </div>
      <button class="btn btn-primary w-100" onclick="hacerLogin()">Entrar</button>
      <div id="login-msg" class="msg-error"></div>
      <hr>
      <p class="text-center mb-0">
        ¿No tienes cuenta?
        <a href="#" onclick="irA('registro'); return false;">Registrarse</a>
      </p>
    </div>
  </div>

  <!-- REGISTRO -->
  <div id="vista-registro" class="vista">
    <div class="card-form card-ancho">
      <h2>Registro de Usuario</h2>

      <div class="row">
        <div class="col-md-6 mb-3">
          <label class="form-label">Cédula *</label>
          <input type="text" id="reg-cedula" class="form-control" placeholder="V-12345678">
        </div>
        <div class="col-md-6 mb-3">
          <label class="form-label">Cargo *</label>
          <select id="reg-cargo" class="form-select">
            <option value="">Seleccione...</option>
            <option>Presidencia</option>
            <option>Despacho</option>
            <option>Observatorio</option>
            <option>CNC</option>
            <option>Gerente de Región</option>
            <option>Gerente de Estado</option>
            <option>Jefe de OPT</option>
            <option>Gerente de Transporte</option>
          </select>
        </div>
      </div>

      <div class="row">
        <div class="col-md-6 mb-3">
          <label class="form-label">Nombres *</label>
          <input type="text" id="reg-nombres" class="form-control">
        </div>
        <div class="col-md-6 mb-3">
          <label class="form-label">Apellidos *</label>
          <input type="text" id="reg-apellidos" class="form-control">
        </div>
      </div>

      <div class="row">
        <div class="col-md-6 mb-3">
          <label class="form-label">Email *</label>
          <input type="email" id="reg-email" class="form-control">
        </div>
        <div class="col-md-6 mb-3">
          <label class="form-label">Teléfono</label>
          <input type="text" id="reg-telefono" class="form-control">
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label">Dirección</label>
        <input type="text" id="reg-direccion" class="form-control">
      </div>

      <div class="row">
        <div class="col-md-4 mb-3">
          <label class="form-label">Región</label>
          <select id="reg-region" class="form-select" onchange="cargarEstadosRegistro()">
            <option value="">Seleccione...</option>
          </select>
        </div>
        <div class="col-md-4 mb-3">
          <label class="form-label">Estado</label>
          <select id="reg-estado" class="form-select">
            <option value="">Seleccione...</option>
          </select>
        </div>
        <div class="col-md-4 mb-3">
          <label class="form-label">OPT</label>
          <input type="text" id="reg-opt" class="form-control" placeholder="Nombre OPT">
        </div>
      </div>

      <hr>

      <div class="row">
        <div class="col-md-6 mb-3">
          <label class="form-label">Usuario *</label>
          <input type="text" id="reg-usuario" class="form-control">
        </div>
        <div class="col-md-6 mb-3">
          <label class="form-label">Clave *</label>
          <input type="password" id="reg-clave" class="form-control">
        </div>
      </div>

      <button class="btn btn-primary w-100" onclick="hacerRegistro()">Registrarme</button>
      <div id="registro-msg" class="msg-error"></div>

      <hr>
      <p class="text-center mb-0">
        ¿Ya tienes cuenta?
        <a href="#" onclick="irA('login'); return false;">Iniciar sesión</a>
      </p>
    </div>
  </div>

  <!-- PANEL (placeholder para Fase 5) -->
  <div id="vista-panel" class="vista">
    <div class="card-form card-ancho">
      <h2>Bienvenido, <span id="panel-nombre"></span></h2>
      <p>Cargo: <strong id="panel-cargo"></strong></p>
      <button class="btn btn-outline-danger" onclick="hacerLogout()">Cerrar sesión</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
