<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OEP — Jerarquía</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
      <a class="navbar-brand" href="panel.html">OEP</a>
      <div class="navbar-nav ms-auto flex-row gap-2">
        <a class="btn btn-sm btn-outline-light" href="estadisticas.html">Estadísticas</a>
        <a class="btn btn-sm btn-outline-light active" href="jerarquia.html">Jerarquía</a>
        <a class="btn btn-sm btn-outline-light" href="perfil.html">Mi perfil</a>
        <button class="btn btn-sm btn-outline-danger" id="btnSalir">Cerrar sesión</button>
      </div>
    </div>
  </nav>

  <!-- ENCABEZADO -->
  <div class="container-fluid my-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h4 class="mb-0">Panel Jerárquico de Escudriñamiento</h4>
      <small class="text-white-50" id="infoCargo"></small>
    </div>

    <!-- LEYENDA -->
    <div class="d-flex flex-wrap gap-3 small text-white-50 mb-3">
      <span><span class="semaforo-punto verde"></span> Sin novedad</span>
      <span><span class="semaforo-punto amarillo"></span> Por reparar</span>
      <span><span class="semaforo-punto rojo"></span> Sin reportar</span>
      <span><span class="semaforo-punto blanco"></span> Aún en plazo</span>
      <span><span class="semaforo-punto naranja-contador">0</span> OPTs inactivas</span>
    </div>

    <!-- CONTENEDOR 3 COLUMNAS -->
    <div class="row g-3" id="contenedorJerarquia">
      <div class="col-md-4">
        <div class="card shadow-sm h-100">
          <div class="card-header bg-secondary text-white">
            <strong id="tituloCol1">Regiones</strong>
          </div>
          <div class="card-body p-0" id="columna1">
            <div class="text-center text-muted py-4">Cargando...</div>
          </div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card shadow-sm h-100">
          <div class="card-header bg-secondary text-white">
            <strong id="tituloCol2">Estados</strong>
          </div>
          <div class="card-body p-0" id="columna2">
            <div class="text-center text-muted py-4 small">
              Selecciona una región
            </div>
          </div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card shadow-sm h-100">
          <div class="card-header bg-secondary text-white">
            <strong id="tituloCol3">OPTs</strong>
          </div>
          <div class="card-body p-0" id="columna3">
            <div class="text-center text-muted py-4 small">
              Selecciona un estado
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- MODAL HISTORIAL -->
  <div class="modal fade" id="modalHistorial" tabindex="-1">
    <div class="modal-dialog modal-xl modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="modalTitulo">Historial</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div id="contenidoHistorial">
            <div class="text-center text-muted py-4">Cargando...</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="jerarquia.js"></script>
</body>
</html>
