<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OEP — Jerarquía</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
      <a class="navbar-brand" href="panel.html">OEP</a>
      <div class="navbar-nav ms-auto flex-row gap-2">
        <a class="btn btn-sm btn-outline-light" href="estadisticas.html">Estadísticas</a>
        <a class="btn btn-sm btn-outline-light active" href="jerarquia.html">Jerarquía</a>
        <a class="btn btn-sm btn-outline-light" href="perfil.html">Mi perfil</a>
        <button class="btn btn-sm btn-outline-danger" id="btnSalir">Cerrar sesión</button>
      </div>
    </div>
  </nav>

  <!-- ENCABEZADO -->
  <div class="container-fluid my-3">
    <div class="d-flex justify-content-between align-items-center mb-2">
      <h5 class="mb-0">Panel Jerárquico</h5>
      <small class="text-white-50" id="infoCargo"></small>
    </div>

    <!-- LEYENDA -->
    <div class="d-flex flex-wrap gap-2 small text-white-50 mb-3">
      <span><span class="semaforo-punto verde"></span> Sin novedad</span>
      <span><span class="semaforo-punto amarillo"></span> Por reparar</span>
      <span><span class="semaforo-punto rojo"></span> Sin reportar</span>
      <span><span class="semaforo-punto blanco"></span> En plazo</span>
      <span><span class="semaforo-punto naranja-contador">0</span> Inactivas</span>
    </div>

    <!-- BREADCRUMB + BOTÓN VOLVER -->
    <div class="d-flex align-items-center gap-2 mb-2" id="barraNavegacion" style="display:none !important;">
      <button class="btn btn-sm btn-outline-light" id="btnVolver" onclick="volverNivel()">← Volver</button>
      <nav aria-label="breadcrumb">
        <ol class="breadcrumb mb-0" id="migasPan"></ol>
      </nav>
    </div>

    <!-- CONTENEDOR DE LISTA -->
    <div class="card shadow-sm">
      <div class="card-header bg-secondary text-white">
        <strong id="tituloNivel">Regiones</strong>
      </div>
      <div class="card-body p-0" id="contenedorLista">
        <div class="text-center text-muted py-4">Cargando...</div>
      </div>
    </div>
  </div>

  <!-- MODAL HISTORIAL -->
  <div class="modal fade" id="modalHistorial" tabindex="-1">
    <div class="modal-dialog modal-xl modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="modalTitulo">Historial</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div id="contenidoHistorial">
            <div class="text-center text-muted py-4">Cargando...</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="jerarquia.js"></script>
</body>
</html>
