<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OEP — Jerarquía</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
      <a class="navbar-brand" href="panel.html">OEP</a>
      <div class="navbar-nav ms-auto flex-row gap-2">
        <a class="btn btn-sm btn-outline-light" href="estadisticas.html">Estadísticas</a>
        <a class="btn btn-sm btn-outline-light active" href="jerarquia.html">Jerarquía</a>
        <a class="btn btn-sm btn-outline-light" href="perfil.html">Mi perfil</a>
        <button class="btn btn-sm btn-outline-danger" id="btnSalir">Cerrar sesión</button>
      </div>
    </div>
  </nav>

  <!-- CONTENIDO -->
  <div class="container my-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h4 class="mb-0">Panel Jerárquico de Escudriñamiento</h4>
      <small class="text-muted" id="infoCargo"></small>
    </div>

    <div class="card shadow-sm">
      <div class="card-body">
        <div id="contenedorSemaforos">
          <div class="text-center text-muted py-4">Cargando semáforos...</div>
        </div>
      </div>
    </div>
  </div>

  <!-- MODAL HISTORIAL -->
  <div class="modal fade" id="modalHistorial" tabindex="-1">
    <div class="modal-dialog modal-xl modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="modalTitulo">Historial</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div id="contenidoHistorial">
            <div class="text-center text-muted py-4">Cargando...</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- LEYENDA -->
  <div class="container mb-4">
    <div class="d-flex flex-wrap gap-3 small text-muted">
      <span><span class="semaforo-punto verde"></span> Reportó</span>
      <span><span class="semaforo-punto naranja"></span> No reportó (1 día)</span>
      <span><span class="semaforo-punto rojo"></span> 2+ días sin reportar</span>
      <span><span class="semaforo-punto blanco"></span> Sin datos aún</span>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="jerarquia.js"></script>
</body>
</html>
