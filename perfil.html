<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OEP — Mi Perfil</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <nav class="navbar navbar-dark" style="background:#1a3d7c;">
    <div class="container-fluid">
      <span class="navbar-brand">OEP — Mi Perfil</span>
      <div class="d-flex align-items-center gap-3">
        <span class="text-white" id="nav-usuario"></span>
        <a href="estadisticas.html" class="btn btn-outline-light btn-sm">Estadísticas</a>
        <a href="historial.html" class="btn btn-outline-light btn-sm">Mis acciones</a>
        <a href="perfil.html" class="btn btn-outline-light btn-sm">Mi perfil</a>
        <a href="filtros.html" id="nav-filtros" class="btn btn-outline-light btn-sm" style="display:none;">Filtros</a>
        <a href="jerarquia.html" id="nav-jerarquia" class="btn btn-outline-light btn-sm" style="display:none;">Jerarquía</a>
        <a href="calendario.html" id="nav-calendario" class="btn btn-outline-light btn-sm" style="display:none;">Calendario</a>
        <button class="btn btn-outline-light btn-sm" onclick="cerrarSesion()">Cerrar sesión</button>
      </div>
    </div>
  </nav>

  <div class="container my-4" style="max-width:600px;">

    <div class="card mb-3">
      <div class="card-body">
        <h5>Datos de la cuenta</h5>
        <p class="mb-1"><strong>Nombre:</strong> <span id="datos-nombre"></span></p>
        <p class="mb-1"><strong>Cargo:</strong> <span id="datos-cargo"></span></p>
        <p class="mb-0"><strong>Estado / Región:</strong> <span id="datos-ubicacion"></span></p>
      </div>
    </div>

    <div class="card">
      <div class="card-body">
        <h5 class="mb-3">Cambiar clave</h5>

        <div class="mb-3">
          <label class="form-label">Clave actual</label>
          <input type="password" id="clave-actual" class="form-control">
        </div>

        <div class="mb-3">
          <label class="form-label">Clave nueva (mínimo 6 caracteres)</label>
          <input type="password" id="clave-nueva" class="form-control">
        </div>

        <div class="mb-3">
          <label class="form-label">Confirmar clave nueva</label>
          <input type="password" id="clave-confirmar" class="form-control">
        </div>

        <button class="btn btn-primary w-100" onclick="cambiarClave()">Cambiar clave</button>
        <div id="msg" class="msg-error"></div>
      </div>
    </div>

  </div>

  <script src="perfil.js"></script>
  <script>
    (function(){
      try {
        var U = JSON.parse(localStorage.getItem('oep_usuario') || 'null');
        if (!U) return;
        var rol = (U.rol || U.cargo || '').toString();
        var verJerarquia = ['Presidencia','Despacho','Observatorio','CNC','Gerente de Región','Gerente de Estado','Jefe de OPT'];
        var verFiltros = ['Presidencia','Despacho','Observatorio','CNC','Gerente de Región','Gerente de Estado'];
        if (verFiltros.indexOf(rol) !== -1) {
          document.getElementById('nav-filtros').style.display = '';
        }
        var verCalendario = ['Observatorio','CNC'];
        if (verJerarquia.indexOf(rol) !== -1) {
          document.getElementById('nav-jerarquia').style.display = '';
        }
        if (verCalendario.indexOf(rol) !== -1) {
          document.getElementById('nav-calendario').style.display = '';
        }
      } catch(e) {}
    })();
  </script>
</body>
</html>
