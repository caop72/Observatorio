<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OEP — Recuperar Clave</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div id="vista-solicitar" class="vista activa">
    <div class="card-form">
      <h2>Recuperar Clave</h2>
      <p class="text-muted">Ingresa tu usuario o cédula. Si estás registrado, recibirás un correo con instrucciones.</p>

      <div class="mb-3">
        <label class="form-label">Usuario o Cédula</label>
        <input type="text" id="identificador" class="form-control" placeholder="Ej: ruben o V-12345678">
      </div>

      <button class="btn btn-primary w-100" onclick="solicitarReset()">Enviar solicitud</button>
      <div id="msg-solicitar" class="msg-error"></div>

      <hr>
      <p class="text-center mb-0">
        <a href="index.html">Volver al inicio de sesión</a>
      </p>
    </div>
  </div>

  <div id="vista-cambiar" class="vista">
    <div class="card-form">
      <h2>Nueva Clave</h2>
      <p class="text-muted">Ingresa tu nueva clave. Debe tener al menos 6 caracteres.</p>

      <div class="mb-3">
        <label class="form-label">Nueva clave</label>
        <input type="password" id="clave-nueva" class="form-control">
      </div>

      <div class="mb-3">
        <label class="form-label">Confirmar nueva clave</label>
        <input type="password" id="clave-confirmar" class="form-control">
      </div>

      <button class="btn btn-primary w-100" onclick="cambiarClaveToken()">Cambiar clave</button>
      <div id="msg-cambiar" class="msg-error"></div>
    </div>
  </div>

  <script src="reset.js"></script>
</body>
</html>
